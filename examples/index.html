<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hermes-ws broadcast demo</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #080b10;
        --panel: #101720;
        --panel-strong: #162131;
        --border: #26364b;
        --text: #e7edf5;
        --muted: #8fa1b8;
        --accent: #6ee7b7;
        --accent-strong: #34d399;
        --danger: #fb7185;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 15% 10%, rgba(52, 211, 153, 0.14), transparent 30rem),
          radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.12), transparent 28rem),
          var(--background);
        color: var(--text);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 64px 0;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 48px);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
      }

      .status::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        content: "";
      }

      .status[data-connected="true"]::before {
        background: var(--accent);
        box-shadow: 0 0 16px var(--accent);
      }

      .hint {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid rgba(110, 231, 183, 0.2);
        border-radius: 14px;
        background: rgba(110, 231, 183, 0.06);
        color: #b6f5dd;
        font-size: 14px;
      }

      .terminal {
        overflow: hidden;
        margin-top: 28px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(16, 23, 32, 0.9);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      .terminal-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-strong);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #475569;
      }

      .dot:first-child {
        background: #f87171;
      }

      .dot:nth-child(2) {
        background: #fbbf24;
      }

      .dot:nth-child(3) {
        background: #34d399;
      }

      .terminal-title {
        margin-left: 8px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      #log {
        min-height: 360px;
        max-height: 55vh;
        overflow-y: auto;
        padding: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.7;
      }

      .entry {
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(38, 54, 75, 0.55);
      }

      .entry:last-child {
        border-bottom: 0;
      }

      .meta {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .entry[data-kind="system"] .text {
        color: #93c5fd;
      }

      .entry[data-kind="message"] .text {
        color: var(--text);
      }

      form {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid var(--border);
        background: var(--panel-strong);
      }

      input {
        min-width: 0;
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        background: #090e15;
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      input:focus {
        border-color: var(--accent-strong);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12);
      }

      button {
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #052e22;
        padding: 0 20px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #a7f3d0;
      }

      button:disabled,
      input:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      @media (max-width: 640px) {
        main {
          padding: 36px 0;
        }

        header {
          flex-direction: column;
        }

        form {
          flex-direction: column;
        }

        button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>hermes-ws</h1>
          <p>A minimal RFC 6455 server. This page connects with the browser's native WebSocket client.</p>
        </div>
        <div id="status" class="status" data-connected="false">Connecting</div>
      </header>

      <div class="hint">Open this URL in a second tab. Messages are broadcast to every connected client.</div>

      <section class="terminal" aria-label="WebSocket message log">
        <div class="terminal-bar">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="terminal-title">ws://localhost:3000/ws</span>
        </div>
        <div id="log" aria-live="polite"></div>
        <form id="message-form">
          <input id="message" autocomplete="off" placeholder="Type a message and press Enter" disabled />
          <button id="send" type="submit" disabled>Send</button>
        </form>
      </section>
    </main>

    <script>
      const status = document.querySelector("#status");
      const log = document.querySelector("#log");
      const form = document.querySelector("#message-form");
      const input = document.querySelector("#message");
      const sendButton = document.querySelector("#send");

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/ws`);

      function append(kind, text, meta) {
        const entry = document.createElement("div");
        entry.className = "entry";
        entry.dataset.kind = kind;

        const metaElement = document.createElement("div");
        metaElement.className = "meta";
        metaElement.textContent = meta;

        const textElement = document.createElement("div");
        textElement.className = "text";
        textElement.textContent = text;

        entry.append(metaElement, textElement);
        log.append(entry);
        log.scrollTop = log.scrollHeight;
      }

      function setConnected(connected) {
        status.dataset.connected = String(connected);
        status.textContent = connected ? "Connected" : "Disconnected";
        input.disabled = !connected;
        sendButton.disabled = !connected;
        if (connected) input.focus();
      }

      socket.addEventListener("open", () => {
        setConnected(true);
        append("system", "WebSocket handshake completed.", new Date().toLocaleTimeString());
      });

      socket.addEventListener("message", async (event) => {
        if (typeof event.data !== "string") {
          append("message", `[binary message: ${event.data.size} bytes]`, new Date().toLocaleTimeString());
          return;
        }

        try {
          const payload = JSON.parse(event.data);
          append(payload.type, payload.text, `${new Date(payload.sentAt).toLocaleTimeString()} · ${payload.clients} online`);
        } catch {
          append("message", event.data, new Date().toLocaleTimeString());
        }
      });

      socket.addEventListener("close", (event) => {
        setConnected(false);
        append("system", `Socket closed with code ${event.code}.`, new Date().toLocaleTimeString());
      });

      socket.addEventListener("error", () => {
        append("system", "Socket error. Check the server terminal.", new Date().toLocaleTimeString());
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text || socket.readyState !== WebSocket.OPEN) return;
        socket.send(text);
        input.value = "";
        input.focus();
      });
    </script>
  </body>
</html>
